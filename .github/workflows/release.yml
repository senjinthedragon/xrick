name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SDL_TAG: release-3.4.18

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build git \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libdbus-1-dev libudev-dev libibus-1.0-dev

      # glslc (shaderc) is needed to compile src/shaders/gpu/*.vert|frag to SPIR-V for
      # shaders_embedded.c's #embed. Try the distro package first (name/availability
      # varies by Ubuntu release); fall back to LunarG's Vulkan SDK apt repo, which
      # always includes it.
      - name: Install glslc
        run: |
          sudo apt-get install -y glslc && exit 0
          echo "glslc not packaged here, adding the LunarG Vulkan SDK repo"
          CODENAME="$(lsb_release -cs)"
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO "/etc/apt/sources.list.d/lunarg-vulkan-$CODENAME.list" "https://packages.lunarg.com/vulkan/lunarg-vulkan-$CODENAME.list"
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          which glslc

      # 4 source files use #embed (C23), which needs GCC 15+ or Clang 19+ -- Ubuntu's
      # own gcc here is 13 ("cc: error: unrecognized command-line option '-std=gnu23'",
      # found by running this job for the first time). Installing a specific recent
      # clang via the official LLVM script rather than hoping the distro gcc catches up.
      - name: Install clang 19
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19

      # Built from source (not the distro package) so the version is pinned and known,
      # rather than whatever Ubuntu happens to ship -- matters for a release binary.
      - name: Build SDL3
        run: |
          git clone --branch "$SDL_TAG" --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-install
          cmake --build /tmp/SDL/build
          cmake --install /tmp/SDL/build

      - name: Build xrick
        working-directory: xrick
        run: |
          export PKG_CONFIG_PATH="/tmp/sdl3-install/lib/pkgconfig:/tmp/sdl3-install/lib64/pkgconfig"
          # $ORIGIN so the binary finds the bundled libSDL3.so next to it rather than
          # needing SDL3 installed system-wide or LD_LIBRARY_PATH set. The \$$ before
          # ORIGIN survives three layers of expansion (this shell, make's $$->$, and the
          # subshell make spawns to run the recipe) as a literal $ORIGIN -- verified
          # locally against an isolated directory with no system SDL3 before writing
          # this workflow.
          make -j"$(nproc)" CC=clang-19 CXX=clang++-19 LDFLAGS='-Wl,-rpath,\$$ORIGIN'
          strip --strip-all ../build/wsl/xrick
          file ../build/wsl/xrick

      - name: Package
        run: |
          OUT=xrick-linux-x86_64
          mkdir "$OUT"
          cp build/wsl/xrick "$OUT/"
          cp /tmp/sdl3-install/lib/libSDL3.so* "$OUT/" 2>/dev/null || cp /tmp/sdl3-install/lib64/libSDL3.so* "$OUT/"
          # a raw Linux binary can't carry an embedded icon the way .exe/.app can --
          # this .desktop + icon is the freedesktop.org equivalent, opt-in since it
          # needs the user to fill in where they actually extracted this to (see
          # xrick/linux/README.txt)
          cp xrick/linux/xrick.desktop xrick/linux/README.txt xrick/icons/xrickST.png "$OUT/"
          zip -r "$OUT.zip" "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: xrick-linux-x86_64
          path: xrick-linux-x86_64.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK (for glslc)
        shell: cmd
        run: |
          curl -L -o VulkanSDK.exe https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe
          VulkanSDK.exe --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core
          echo %VULKAN_SDK%

      - name: Add glslc to PATH
        shell: bash
        run: |
          # cygpath -w: the later MSBuild step runs under cmd.exe, which can't resolve
          # a POSIX-style /c/... path (found by running this job for the first time --
          # glslc wasn't found despite this step claiming to add it to PATH).
          VSDK=$(cygpath -w "$(ls -d /c/VulkanSDK/*/Bin | sort -V | tail -1)")
          echo "$VSDK" >> "$GITHUB_PATH"

      - name: vcpkg install
        working-directory: xrick
        shell: cmd
        run: |
          "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" install --triplet x64-windows

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (MSBuild, Release x64)
        shell: cmd
        run: msbuild xrick\xrick.vcxproj -t:Build -p:Configuration=Release -p:Platform=x64 -nologo -v:normal

      - name: Download the VC++ Redistributable installer
        shell: bash
        # Tried bundling loose VCRUNTIME140[_1].dll + the full Universal CRT
        # redistributable set instead of this (2026-10-12), to avoid needing an
        # installer at all -- confirmed, in a real Windows 11 VM, that this did
        # NOT fix "VCRUNTIME140.dll was not found" even with every file genuinely
        # present (exit code 0xC0000135/STATUS_DLL_NOT_FOUND). Installing the
        # real Redistributable did fix it, even with every one of those bundled
        # files then deleted -- so a real install is what's actually needed here,
        # same as plenty of other Windows games. This is Microsoft's own official
        # permanent redirect link (https://aka.ms/vs/17/release/vc_redist.x64.exe),
        # not a third-party mirror.
        run: curl -L -o vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe

      - name: Package
        shell: bash
        run: |
          OUT=xrick-windows-x64
          mkdir "$OUT"
          cp xrick/bin/Release/xrick.exe "$OUT/"
          cp xrick/bin/Release/SDL3.dll "$OUT/"
          cp vc_redist.x64.exe "$OUT/"
          cp xrick/windows/README.txt "$OUT/"
          7z a "$OUT.zip" "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: xrick-windows-x64
          path: xrick-windows-x64.zip

  build-windows-arm64:
    # Best-effort, like build-macos: no ARM64 Windows machine to test on. Cross-compiled
    # from a normal x64 runner (no windows-11-arm runner needed) -- the v143 toolset
    # natively supports targeting ARM64 from an x64 host, and vcpkg's arm64-windows
    # triplet cross-compiles SDL3 the same way. glslc still runs as an ordinary x64
    # build-time tool either way (it only ever produces architecture-independent
    # SPIR-V bytecode, never something linked into the binary).
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK (for glslc)
        shell: cmd
        run: |
          curl -L -o VulkanSDK.exe https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.exe
          VulkanSDK.exe --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core
          echo %VULKAN_SDK%

      - name: Add glslc to PATH
        shell: bash
        run: |
          VSDK=$(cygpath -w "$(ls -d /c/VulkanSDK/*/Bin | sort -V | tail -1)")
          echo "$VSDK" >> "$GITHUB_PATH"

      - name: vcpkg install
        working-directory: xrick
        shell: cmd
        run: |
          "%VCPKG_INSTALLATION_ROOT%\vcpkg.exe" install --triplet arm64-windows

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Build (MSBuild, Release ARM64)
        shell: cmd
        run: msbuild xrick\xrick.vcxproj -t:Build -p:Configuration=Release -p:Platform=ARM64 -nologo -v:normal

      - name: Download the VC++ Redistributable installer
        shell: bash
        run: curl -L -o vc_redist.arm64.exe https://aka.ms/vs/17/release/vc_redist.arm64.exe

      - name: Package
        shell: bash
        # windows/README.txt names vc_redist.x64.exe specifically (it's written for the
        # x64 package) -- swapped to arm64 here since that's the actual file bundled.
        run: |
          OUT=xrick-windows-arm64
          mkdir "$OUT"
          cp xrick/bin/Release/xrick.exe "$OUT/"
          cp xrick/bin/Release/SDL3.dll "$OUT/"
          cp vc_redist.arm64.exe "$OUT/"
          sed 's/vc_redist\.x64\.exe/vc_redist.arm64.exe/' xrick/windows/README.txt > "$OUT/README.txt"
          7z a "$OUT.zip" "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: xrick-windows-arm64
          path: xrick-windows-arm64.zip

  build-macos:
    # Best-effort: neither of us can run or test macOS. This job mirrors the Linux
    # job's approach (SDL3 from source, Makefile, rpath-relative bundling) but is not
    # verified to actually work.
    runs-on: macos-latest
    continue-on-error: true
    env:
      # macos-latest is an Apple Silicon runner and would otherwise build arm64-only
      # binaries targeting its own macOS version -- unusable on Intel Macs and older
      # systems. 11.0 (Big Sur) is the first release that runs on both architectures.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install pkg-config shaderc ninja cmake

      - name: Build SDL3
        run: |
          git clone --branch "$SDL_TAG" --depth 1 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/sdl3-install \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build /tmp/SDL/build
          cmake --install /tmp/SDL/build

      - name: Build SDL_shadercross
        # Transpiles our SPIR-V shaders to MSL at build time, so macOS gets the real CRT/FSR/bezel
        # shaders instead of the plain-renderer fallback (see sysvid_gpu.c). Built for the runner's
        # own arch only -- this is a build-time tool, not something that ships. No tagged releases
        # exist, so this is pinned to a commit instead. DXC (HLSL/DXIL/DXBC support) is turned off
        # since we only ever go SPIR-V -> MSL, which needs just SPIRV-Cross -- but the vendored
        # DirectXShaderCompiler submodule still has to be checked out (even empty of its own
        # history) because CMakeLists.txt unconditionally asserts the submodule directory isn't
        # empty, regardless of SDLSHADERCROSS_DXC.
        env:
          SHADERCROSS_SHA: 1ff05bec573988a98ef9e0260b4da44f512b8367
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL_shadercross.git /tmp/SDL_shadercross
          cd /tmp/SDL_shadercross
          git fetch --depth 1 origin "$SHADERCROSS_SHA"
          git checkout "$SHADERCROSS_SHA"
          git submodule update --init --depth 1 \
            external/SPIRV-Cross external/SPIRV-Headers external/SPIRV-Tools external/DirectXShaderCompiler
          # needs SDL3 itself (find_package) -- reuse the one the previous step just built,
          # rather than fetching/building a second copy.
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/tmp/sdl3-install \
            -DSDLSHADERCROSS_VENDORED=ON -DSDLSHADERCROSS_DXC=OFF \
            -DSDLSHADERCROSS_CLI=ON -DSDLSHADERCROSS_STATIC=ON
          cmake --build build

      - name: Build xrick
        working-directory: xrick
        run: |
          export PKG_CONFIG_PATH="/tmp/sdl3-install/lib/pkgconfig"
          # the CLI links against libSDL3_shadercross dynamically even with STATIC=ON (that flag
          # only affects how it links SPIRV-Cross) -- it needs to find that dylib to run at all.
          export DYLD_LIBRARY_PATH="/tmp/SDL_shadercross/build:$DYLD_LIBRARY_PATH"
          # universal binary; passed via the environment, not as make arguments, so the
          # Makefile's own CFLAGS += (include paths, SDL flags) still get appended
          CFLAGS='-arch arm64 -arch x86_64' CXXFLAGS='-arch arm64 -arch x86_64' LDFLAGS='-arch arm64 -arch x86_64 -Wl,-rpath,@executable_path' \
            make -j"$(sysctl -n hw.ncpu)" XRICK_MSL_SHADERS=1 SHADERCROSS=/tmp/SDL_shadercross/build/shadercross
          strip -S ../build/wsl/xrick
          file ../build/wsl/xrick

      - name: Package
        run: |
          OUT=xrick-macos
          APP="$OUT/xrick.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/wsl/xrick "$APP/Contents/MacOS/"
          # the dylib stays alongside the binary in Contents/MacOS, not Resources --
          # the build's own rpath (set above, @executable_path) resolves relative to
          # wherever the executable itself is, so this has to be the same directory.
          cp /tmp/sdl3-install/lib/libSDL3*.dylib "$APP/Contents/MacOS/"
          install_name_tool -change "$(otool -L "$APP/Contents/MacOS/xrick" | grep libSDL3 | awk '{print $1}')" \
            "@rpath/$(basename "$APP/Contents/MacOS"/libSDL3*.dylib)" "$APP/Contents/MacOS/xrick"
          # a bare binary has nowhere to carry an icon or any of the Windows .exe-style
          # file info (company/version/copyright) -- a real .app bundle is what both of
          # those need on macOS. iconutil is Apple's own tool (only available here, on
          # the macos-latest runner), built from the pre-generated iconset in the repo
          # (xrick/icons/xrick.iconset -- nearest-neighbor upscaled from the original
          # 32x32 xrickST.ico, kept crisp rather than blurry to match the rest of the
          # project's pixel-art look).
          iconutil -c icns xrick/icons/xrick.iconset -o "$APP/Contents/Resources/xrick.icns"
          sed "s/__VERSION__/${GITHUB_REF_NAME#v}/g" xrick/macos/Info.plist > "$APP/Contents/Info.plist"
          zip -r "$OUT.zip" "$OUT"

      # The only arm64 testing possible without real hardware: macos-latest is itself
      # Apple Silicon, so running the (universal) binary directly here exercises its
      # arm64 slice -- the Tahoe VM we otherwise test this build in is x86_64-only.
      # SDL_VIDEODRIVER/AUDIODRIVER=dummy since there's no real display/audio device on
      # the runner; this only catches load-time failures (missing dylib, bad rpath,
      # a codesign/Gatekeeper problem that would stop it launching at all), not
      # rendering or audio bugs -- those still need a real Mac.
      - name: Smoke-test the arm64 slice
        run: |
          BIN="xrick-macos/xrick.app/Contents/MacOS/xrick"
          file "$BIN"
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy arch -arm64 "$BIN" &
          PID=$!
          sleep 3
          if kill -0 $PID 2>/dev/null; then
            echo "still running after 3s -- arm64 slice loaded and started fine"
            kill $PID
            wait $PID 2>/dev/null || true
          else
            wait $PID || true
            echo "##[error]xrick exited on its own within 3s -- arm64 slice likely failed to load or start"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: xrick-macos
          path: xrick-macos.zip

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build web
        run: EMSDK_DIR="$EMSDK" ./build.sh web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      # actions/upload-pages-artifact above packs its own tarball for the Pages deploy
      # job specifically -- not something a person can usefully download and unzip, so
      # this is a second, plain zip of the same build/web/ for the release's own assets
      # (Senjin's request 2026-10-12: make the web build downloadable, not just playable
      # live via Pages).
      - name: Package web
        run: |
          OUT=xrick-web
          mkdir "$OUT"
          cp build/web/index.html build/web/player.js build/web/style.css build/web/favicon.ico build/web/xrick.js build/web/xrick.wasm "$OUT/"
          zip -r "$OUT.zip" "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: xrick-web
          path: xrick-web.zip

  deploy-pages:
    needs: build-web
    # Used to be branch-pushes/dispatch only: the github-pages environment's own
    # deployment-branch-policy allowlist only had `master` on it, so a tag ref got
    # rejected outright ("Tag v2.0.0 is not allowed to deploy to github-pages") and
    # every tagged release needed a separate manual `gh workflow run` dispatch
    # afterward just to redeploy Pages. Fixed 2026-10-14 by adding a `v*` tag policy
    # to that environment (repo Settings -> Environments -> github-pages -> Deployment
    # branches and tags) -- tag pushes now deploy directly, no second dispatch needed.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [build-linux, build-windows, build-windows-arm64, build-macos, build-web]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes/${{ github.ref_name }}.md
          files: artifacts/*/*.zip

  deploy-itch:
    needs: [build-linux, build-windows, build-windows-arm64, build-macos, build-web]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      ITCH_TARGET: senjinthedragon/rick-dangerous
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: jdno/setup-butler@v2.0.0

      # Each artifact is the same zip the GitHub release gets, containing one
      # top-level folder (xrick-linux-x86_64/, xrick-windows-x64/, etc.) -- unzipped
      # here so itch.io's own download keeps that same folder structure rather than
      # a zip-of-a-zip. The web build is the one exception: it's pushed as its own
      # html5 channel from the unzipped xrick-web/ folder, which already has
      # index.html at its top level -- required for itch's "play in browser" to work.
      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          push() {
            local artifact="$1" channel="$2"
            unzip -o "artifacts/$artifact/$artifact.zip" -d "unpacked/$artifact"
            butler push "unpacked/$artifact/$artifact" "$ITCH_TARGET:$channel" --userversion "$VERSION"
          }
          push xrick-linux-x86_64 linux
          push xrick-windows-x64 windows
          push xrick-windows-arm64 windows-arm64
          push xrick-macos mac
          push xrick-web html5
